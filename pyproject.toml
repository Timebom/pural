[project]
name = "pural"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sounddevice",
    "numpy",
    "piper-tts>=1.8.0",
    "onnxruntime>=1.31.0",
    "faster-whisper>=1.2.1",
    "openwakeword>=0.6.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "ollama>=0.6.3",
    "ddgs>=9.16.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not live'"
markers = ["live: needs a running Ollama server and a pulled model (run with: pytest -m live)"]

[project.scripts]
assistant = "assistant.__main__:main"

[tool.uv]
package = true
